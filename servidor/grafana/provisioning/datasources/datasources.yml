apiVersion: 1

datasources:
  - name: InfluxDB IOTDC
    uid: influxdb-iotdc
    type: influxdb
    access: proxy
    url: http://influxdb:8086
    isDefault: true
    jsonData:
      version: Flux
      organization: ${INFLUX_ORG}
      defaultBucket: ${INFLUX_BUCKET}
    secureJsonData:
      token: ${INFLUX_TOKEN}

  - name: PostgreSQL Configuración
    uid: postgres-config
    type: grafana-postgresql-datasource
    url: postgres:5432
    user: grafana_ro
    jsonData:
      database: iotdc_config
      sslmode: disable
      postgresVersion: 1700
    secureJsonData:
      password: ${GRAFANA_PG_PASSWORD}
