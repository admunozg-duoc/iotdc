<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Empresas - IOTDC</title>
<style>
  body { font-family: system-ui, sans-serif; background: #f2f4f7; color: #1c2733; margin: 0; padding: 24px 16px; }
  main { max-width: 760px; margin: auto; }
  h1 { font-size: 22px; margin: 0 0 4px; }
  h2 { font-size: 17px; margin: 0 0 14px; }
  p.ayuda { margin: 0 0 20px; color: #52606d; font-size: 14px; }
  section { background: #fff; border-radius: 10px; padding: 20px; margin-bottom: 20px; }
  label { display: block; font-size: 14px; margin-bottom: 12px; }
  input { display: block; width: 100%; box-sizing: border-box; margin-top: 4px; padding: 10px;
          font-size: 16px; border: 1px solid #b8c2cc; border-radius: 6px; }
  button { padding: 11px 22px; font-size: 16px; border: 0; border-radius: 6px; background: #0b6bcb;
           color: #fff; cursor: pointer; }
  button:disabled { opacity: .6; cursor: default; }
  button.secundario { background: #e4e7eb; color: #1c2733; }
  button.peligro { background: #c53030; }
  td button { padding: 6px 12px; font-size: 14px; margin-right: 6px; }
  #cancelar { margin-left: 8px; }
  .aviso { padding: 10px 12px; border-radius: 6px; margin-bottom: 14px; font-size: 15px; }
  .ok { background: #e3f6e8; color: #17603a; }
  .error { background: #fde8e8; color: #9b1c1c; }
  .tabla { overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; font-size: 14px; }
  th, td { text-align: left; padding: 9px 10px; border-bottom: 1px solid #e4e7eb; white-space: nowrap; }
  th { color: #52606d; font-weight: 600; }
  td.id { font-weight: 700; font-size: 16px; }
</style>
</head>
<body>
<main>
  <h1>Empresas</h1>
  <p class="ayuda">Al dar de alta un sensor, escribe el ID de su empresa en el campo
    «ID del cliente» del portal de configuración del equipo.</p>

  <section>
    <h2 id="titulo">Registrar una empresa</h2>
    <div id="aviso" class="aviso" hidden></div>
    <form id="formulario">
      <label>Nombre<input name="nombre" maxlength="120" required></label>
      <label>RUT (opcional)<input name="rut" maxlength="12" placeholder="76.123.456-7"></label>
      <label>Correo de contacto (opcional)<input name="contacto_email" type="email" maxlength="160"></label>
      <button type="submit" id="guardar">Guardar</button>
      <button type="button" id="cancelar" class="secundario" hidden>Cancelar</button>
    </form>
  </section>

  <section>
    <h2>Empresas registradas</h2>
    <div class="tabla">
      <table>
        <thead><tr><th>ID</th><th>Nombre</th><th>RUT</th><th>Correo</th><th>Sensores</th><th>Acciones</th></tr></thead>
        <tbody id="filas"></tbody>
      </table>
    </div>
  </section>
</main>

<script>
const formulario = document.getElementById('formulario');
const aviso = document.getElementById('aviso');
const filas = document.getElementById('filas');
const guardar = document.getElementById('guardar');
const cancelar = document.getElementById('cancelar');
const titulo = document.getElementById('titulo');
let editando = null;  // ID de la empresa en edición, o null si se está registrando una nueva

function mostrarAviso(texto, tipo) {
  aviso.textContent = texto;
  aviso.className = 'aviso ' + tipo;
  aviso.hidden = false;
}

// La API responde {"detail": "..."} o una lista de errores de validación
function textoError(cuerpo) {
  if (typeof cuerpo.detail === 'string') return cuerpo.detail;
  if (Array.isArray(cuerpo.detail)) return 'Revisa los datos ingresados.';
  return 'No se pudo completar la operación.';
}

async function cargarEmpresas() {
  const respuesta = await fetch('/api/v1/empresas');
  if (!respuesta.ok) {
    mostrarAviso('No se pudo cargar el listado de empresas.', 'error');
    return;
  }
  filas.replaceChildren();
  for (const empresa of await respuesta.json()) {
    const fila = document.createElement('tr');
    const valores = [empresa.id, empresa.nombre, empresa.rut || '—', empresa.contacto_email || '—',
                     empresa.dispositivos];
    valores.forEach((valor, i) => {
      const celda = document.createElement('td');
      celda.textContent = valor;
      if (i === 0) celda.className = 'id';
      fila.appendChild(celda);
    });
    const acciones = document.createElement('td');
    acciones.appendChild(boton('Editar', 'secundario', () => empezarEdicion(empresa)));
    acciones.appendChild(boton('Eliminar', 'peligro', () => eliminarEmpresa(empresa)));
    fila.appendChild(acciones);
    filas.appendChild(fila);
  }
}

function boton(texto, clase, accion) {
  const elemento = document.createElement('button');
  elemento.type = 'button';
  elemento.textContent = texto;
  elemento.className = clase;
  elemento.addEventListener('click', accion);
  return elemento;
}

function empezarEdicion(empresa) {
  editando = empresa.id;
  formulario.nombre.value = empresa.nombre;
  formulario.rut.value = empresa.rut || '';
  formulario.contacto_email.value = empresa.contacto_email || '';
  titulo.textContent = `Editar la empresa ${empresa.id}`;
  guardar.textContent = 'Guardar cambios';
  cancelar.hidden = false;
  aviso.hidden = true;
  formulario.nombre.focus();
  titulo.scrollIntoView({ behavior: 'smooth', block: 'center' });
}

function terminarEdicion() {
  editando = null;
  formulario.reset();
  titulo.textContent = 'Registrar una empresa';
  guardar.textContent = 'Guardar';
  cancelar.hidden = true;
}

async function eliminarEmpresa(empresa) {
  if (!confirm(`¿Eliminar la empresa «${empresa.nombre}» (ID ${empresa.id})? No se puede deshacer.`)) {
    return;
  }
  try {
    const respuesta = await fetch(`/api/v1/empresas/${empresa.id}`, { method: 'DELETE' });
    if (respuesta.ok) {
      if (editando === empresa.id) terminarEdicion();
      mostrarAviso(`Empresa «${empresa.nombre}» eliminada.`, 'ok');
      await cargarEmpresas();
    } else {
      mostrarAviso(textoError(await respuesta.json()), 'error');
    }
  } catch (error) {
    mostrarAviso('No se pudo conectar con el servidor.', 'error');
  }
}

cancelar.addEventListener('click', terminarEdicion);

formulario.addEventListener('submit', async (evento) => {
  evento.preventDefault();
  guardar.disabled = true;
  const datos = Object.fromEntries(new FormData(formulario));
  // Los campos opcionales vacíos se envían como null
  for (const campo of ['rut', 'contacto_email']) {
    datos[campo] = datos[campo].trim() || null;
  }
  try {
    const respuesta = await fetch(editando === null ? '/api/v1/empresas' : `/api/v1/empresas/${editando}`, {
      method: editando === null ? 'POST' : 'PUT',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(datos),
    });
    const cuerpo = await respuesta.json();
    if (respuesta.ok) {
      const accion = editando === null ? 'registrada con' : 'actualizada; conserva';
      mostrarAviso(`Empresa «${cuerpo.nombre}» ${accion} el ID ${cuerpo.id}.`, 'ok');
      terminarEdicion();
      await cargarEmpresas();
    } else {
      mostrarAviso(textoError(cuerpo), 'error');
    }
  } catch (error) {
    mostrarAviso('No se pudo conectar con el servidor.', 'error');
  } finally {
    guardar.disabled = false;
  }
});

cargarEmpresas();
</script>
</body>
</html>
